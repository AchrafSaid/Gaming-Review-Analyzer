<head>

  <title>Gaming Review Analyzer - Phase 2</title>
  <style>
    :root { --ink:#17212b; --muted:#5f6d7a; --bg:#f6f2ea; --panel:#ffffff; --accent:#0f7c80; --amber:#c27a2c; --line:#ded6ca; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#10202a; color:#fff; padding:28px 42px; }
    h1 { margin:0 0 8px; font-size:34px; }
    h2 { margin:0 0 14px; font-size:22px; }
    .sub { color:#c9d5df; max-width:920px; line-height:1.45; }
    main { padding:28px 42px 48px; }
    .metrics { display:grid; grid-template-columns:repeat(4, minmax(140px,1fr)); gap:14px; margin-bottom:24px; }
    .metric, .panel, .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
    .metric b { display:block; font-size:30px; margin-bottom:4px; }
    .metric span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .controls { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin-bottom:18px; }
    input, select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:6px; font-size:15px; background:#fff; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; align-items:start; }
    .results { display:grid; gap:12px; }
    .card h3 { margin:0 0 8px; font-size:18px; }
    .meta { color:var(--muted); font-size:13px; margin-bottom:8px; }
    .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#e9f3f3; color:var(--accent); font-size:12px; margin-right:6px; }
    .badge.neg { background:#f6e7e9; color:#b54e5a; }
    .badge.neu { background:#f4eee4; color:#936221; }
    .summary { line-height:1.45; }
    .profiles { display:grid; gap:10px; }
    .profile { border-top:1px solid var(--line); padding-top:10px; }
    .profile:first-child { border-top:0; padding-top:0; }
    .terms { color:var(--muted); font-size:13px; }
    @media (max-width: 900px) { .metrics, .controls, .grid { grid-template-columns:1fr; } main, header { padding-left:20px; padding-right:20px; } }
  </style>
</head>

draws you in so much that it's a metaphor for how it will kill your love life. 10/10, would platinum again."}, {"id": "1086940-a133e295638b", "app_id": 1086940, "title": "Baldur's Gate 3", "genre": "RPG", "recommended": true, "user_score": 10.0, "playtime_hours_at_review": 142.3, "original_sentiment_label": "positive", "ai_sentiment_label": "neutral", "ai_sentiment_score": 0.009, "ai_recommendation_prediction": true, "primary_topic": "replayability", "topic_scores": {"story": 1, "gameplay": 2, "performance": 0, "world": 0, "visual_audio": 0, "value": 1, "replayability": 3, "multiplayer": 0}, "top_tfidf_terms": [{"term": "finishing", "tfidf": 0.087, "count": 3}, {"term": "way", "tfidf": 0.0752, "count": 3}, {"term": "people", "tfidf": 0.0613, "count": 3}, {"term": "never", "tfidf": 0.0613, "count": 3}, {"term": "touched", "tfidf": 0.058, "count": 2}, {"term": "rather", "tfidf": 0.058, "count": 2}, {"term": "original", "tfidf": 0.058, "count": 2}, {"term": "consequence", "tfidf": 0.058, "count": 2}], "keyword_string": "finishing, way, people, never, touched", "review_summary": "Worth going back and actually finishing this time.", "review_text": "You said \"ala akhbar\" and I changed it to \"allahu akbar\" which isn't what you wrote. I'll keep your original phrasing next time. And you're right, I dropped the part about not finishing it. Here's the corrected version: Baldur's Gate 3 is one of the better arguments for the CRPG genre reaching a mainstream audience it hasn't touched since the late 90s. Larian built something with a production quality and level of reactivity that made it impossible to ignore even for people who had never touched Divinity or the original Baldur's Gate games, and the results speak for themselves in terms of how many people it pulled into a style of game they would never have otherwise tried. The storytelling is the strongest part. The writing across the main cast is consistently good and the way the game responds to your choices with actual consequence rather than the illusion of consequence is what separates it from most RPGs claiming to offer the same thing. The companions have enough depth that spending time with them feels worthwhile rather than obligatory, which for a game asking this many hours of you matters more than people give it credit for. The systemic flexibility is where it earns its reputation most honestly. Talking your way through a fight, finding an environmental solution nobody intended, or handing Gale the nuclear option and ala akhbar-ing your way to the credits (which was my exit) instead of finishing the game properly, the game accommodates all of it without blinking. That openness is rare and Larian spent years refining it across their previous work before landing here. The overhype conversation is fair though. It is an exceptional game and also a very long one that asks real patience before it fully opens up, and the discourse around launch inflated expectations in ways the game itself was never going to satisfy for everyone. Worth going back and actually finishing this time. Works well on both PC and Steam Deck."}, {"id": "1086940-79c92fc2ef27", "app_id": 1086940, "title": "Baldur's Gate 3", "genre": "RPG", "recommended": true, "user_score": 10.0, "playtime_hours_at_review": 366.7, "original_sentiment_label": "neutral", "ai_sentiment_label": "neutral", "ai_sentiment_score": 0.0, "ai_recommendation_prediction": true, "primary_topic": "general", "topic_scores": {"story": 0, "gameplay": 0, "performance": 0, "world": 0, "visual_audio": 0, "value": 0, "replayability": 0, "multiplayer": 0}, "top_tfidf_terms": [{"term": "act", "tfidf": 1.4579, "count": 4}, {"term": "tip", "tfidf": 0.3645, "count": 1}, {"term": "timer", "tfidf": 0.3645, "count": 1}, {"term": "rest", "tfidf": 0.3645, "count": 1}, {"term": "onto", "tfidf": 0.3645, "count": 1}, {"term": "moving", "tfidf": 0.3645, "count": 1}, {"term": "interaction", "tfidf": 0.3645, "count": 1}, {"term": "companion", "tfidf": 0.3645, "cou 3}], "keyword_string": "chat, voice, mmo, it's, mobile", "review_summary": "This is literally the future of MMO gaming, for better or worse.", "review_text": "This is literally the future of MMO gaming, for better or worse. And since it's free, if you're an enthusiast of Exploration/MMO/Open world genres, I recommend to try it. It's far from a perfect game, mind you - but it does try a lot of experimental things, and gets a noticeable number of them right... or almost right. See below. Some outstanding features: [+++] Customizable experience (controls, difficulty, UI, social features) |+++] Ridiculous QoL (tooltips tell how to acquire/use all items, filters on map to see enemy or resource spawns, equipment filtering, auto disassembly, etc) [ + ] Simple ARPG combat that is actually 80% optional [???] AI chatbot NPCs to up relations. It's barebones and only funny 5 minutes. [ + ] AI Voice/Appearance import from external media in char creation [ + ] Assisted blocking with slowmo - Optional [ - ] Mobile slop monetization, mostly cosmetics [+++] Heavily exploration centric game with vibes to match [+++] I'm not kidding, you can walk in on bandit outposts and play chess with them [---] Menu hell, you spend half of the game in menus unlocking things [????????????????] Social feature overload: public gifting, chat transcript, voice chat, in-chat voice chat, you can literally level up your relation with other players, partnerships/disciples system, on-map signs for other players, pre-made raidgroups, guilds (yes, separate), bounty system -- there's more than i could even imagine [+++] 2 profession (scholar/healer) both for exploration and group content, also as \"mercenary\" to help other players (cure them, clear their name, etc) [???] PvP invade and kill people that did in fact not clear their name [--] Bounty systems for the above stuff has insane player competition, i could never find a job for it [...] Ramping up flashy main story (feels like Warframe, negative for me b     const reviews = DATA.review_features || [];
    const profiles = DATA.game_profiles || [];
    const topics = [...new Set(reviews.map(r => r.primary_topic).filter(Boolean))].sort();
    document.getElementById('mReviews').textContent = reviews.length;
    document.getElementById('mGames').textContent = profiles.length;
    document.getElementById('mTerms').textContent = (DATA.global_terms || []).length;
    document.getElementById('mTopics').textContent = topics.length;
    for (const topic of topics) {
      const opt = document.createElement('option');
      opt.value = topic;
      opt.textContent = topic.replaceAll('_', ' ');
      document.getElementById('topic').appendChild(opt);
    }
    function sentimentBadge(label) {
      const cls = label === 'negative' ? 'neg' : label === 'neutral' ? 'neu' : '';
      return `<span class="badge ${cls}">${label || 'unknown'}</span>`;
    }
    function matchesQuery(review, q) {
      if (!q) return true;
      const haystack = [review.title, review.genre, review.primary_topic, review.keyword_string, review.review_text].join(' ').toLowerCase();
      return q.toLowerCase().split(/\s+/).every(term => haystack.includes(term));
    }
    function render() {
      const q = document.getElementById('query').value.trim();
      const topic = document.getElementById('topic').value;
      const sentiment = document.getElementById('sentiment').value;
      const filtered = reviews.filter(r => matchesQuery(r, q) && (!topic || r.primary_topic === topic) && (!sentiment || r.ai_sentiment_label === sentiment)).slice(0, 20);
      document.getElementById('results').innerHTML = filtered.map(r => `
        <article class="card">
          <h3>${r.title || 'Unknown game'}</h3>
          <div class="meta">${r.genre || 'unknown genre'} | topic: ${(r.primary_topic || 'general').replaceAll('_',' ')} | score: ${r.ai_sentiment_score}</div>
          <div>${sentimentBadge(r.ai_sentiment_label)}<span class="badge">${r.recommended ? 'Steam recommended' : 'Steam not recommended'}</span></div>
          <p class="summary">${escapeHtml(r.review_summary || '')}</p>
          <div class="terms">Keywords: ${r.keyword_string || 'none'}</div>
        </article>
      `).join('') || '<div class="card">No matching reviews found.</div>';

      document.getElementById('profiles').innerHTML = profiles.slice(0, 10).map(p => `
        <div class="profile">
          <b>${p.title}</b>
          <div class="meta">${p.review_count} reviews | recommended: ${Math.round(p.recommendation_rate * 100)}%</div>
          <div class="summary">${escapeHtml(p.insight_summary || '')}</div>
          <div class="terms">Top terms: ${(p.top_terms || []).join(', ')}</div>
        </div>
      `).join('');
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }
    document.getElementById('query').addEventListener('input', render);
    document.getElementById('topic').addEventListener('change', render);
    document.getElementById('sentiment').addEventListener('change', render);
    render();
  </script>
